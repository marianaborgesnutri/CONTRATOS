# Mantém o projeto do Supabase ativo (o plano gratuito pausa depois de ~7 dias sem uso).
# Roda sozinho a cada 3 dias. Também dá para rodar na mão em Actions > Manter Supabase ativo > Run workflow.
name: Manter Supabase ativo

on:
  schedule:
    - cron: "0 12 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Acessar o banco
        run: |
          curl -s -o /dev/null -w "Resposta do Supabase: %{http_code}\n" \
            "https://yjuorotwwytjjadwwbrr.supabase.co/rest/v1/pacientes?select=id&limit=1" \
            -H "apikey: sb_publishable_-yYYT8OwH8CotGE0RAC--g_CzOuM0KN"
